# Fine-tuning PP-OCRv5 mobile recognition for Vietnamese + English.
# Run from the PaddleOCR repository root (tools/train.py); paths are overridden by train.sh.
Global:
  model_name: latin_PP-OCRv5_mobile_rec  # architecture name PaddleX uses to load the exported model
  debug: false
  use_gpu: false
  epoch_num: 6
  log_smooth_window: 20
  print_batch_step: 20
  save_model_dir: ./output/vi_en_PP-OCRv5_mobile_rec
  save_epoch_step: 1
  eval_batch_step: [0, 1000]
  cal_metric_during_train: true
  pretrained_model: ./pretrained/vi_en_init.pdparams
  checkpoints:
  save_inference_dir:
  use_visualdl: false
  infer_img:
  character_dict_path: ./vi_en_dict.txt
  infer_mode: false
  use_space_char: true
  distributed: false
  save_res_path: ./output/vi_en_rec_predicts.txt
  d2s_train_image_shape: [3, 48, 320]

Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    learning_rate: 0.0003
    warmup_epoch: 1
  regularizer:
    name: L2
    factor: 3.0e-05

Architecture:
  model_type: rec
  algorithm: SVTR_LCNet
  Transform:
  Backbone:
    name: PPLCNetV3
    scale: 0.95
  Head:
    name: MultiHead
    head_list:
      - CTCHead:
          Neck:
            name: svtr
            dims: 120
            depth: 2
            hidden_dims: 120
            kernel_size: [1, 3]
            use_guide: True
          Head:
            fc_decay: 0.00001
      - NRTRHead:
          nrtr_dim: 384
          max_text_length: 25

Loss:
  name: MultiLoss
  loss_config_list:
    - CTCLoss:
    - NRTRLoss:

PostProcess:
  name: CTCLabelDecode

Metric:
  name: RecMetric
  main_indicator: acc
  ignore_space: False

Train:
  dataset:
    name: SimpleDataSet
    data_dir: ./data/train/
    label_file_list:
      - ./data/train/labels.txt
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: false
      # No random crop: cutting the top/bottom rows would remove diacritics and corrupt labels.
      - RecAug:
          tia_prob: 0.2
          crop_prob: 0.0
          reverse_prob: 0.0
          noise_prob: 0.1
          jitter_prob: 0.2
          blur_prob: 0.1
          hsv_aug_prob: 0.2
      - MultiLabelEncode:
          max_text_length: 25
          gtc_encode: NRTRLabelEncode
      - RecResizeImg:
          image_shape: [3, 48, 320]
      - KeepKeys:
          keep_keys:
            - image
            - label_ctc
            - label_gtc
            - length
            - valid_ratio
  loader:
    shuffle: true
    batch_size_per_card: 64
    drop_last: true
    num_workers: 2

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: ./data/eval/
    label_file_list:
      - ./data/eval/labels.txt
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: false
      - MultiLabelEncode:
          max_text_length: 25
          gtc_encode: NRTRLabelEncode
      - RecResizeImg:
          eval_mode: True
          image_shape: [3, 48, 320]
      - KeepKeys:
          keep_keys:
            - image
            - label_ctc
            - label_gtc
            - length
            - valid_ratio
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 64
    num_workers: 2
