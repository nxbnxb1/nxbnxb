[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docextract"
version = "1.0.0"
description = "PDF / Word / scanned images (Vietnamese + English, Vietnamese + English + Japanese) to Markdown + JSON with PaddleOCR and a VLM for visual content"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pymupdf>=1.24",
  "python-docx>=1.1",
  "pillow>=10.0",
  "numpy>=1.24",
  "pydantic>=2.5",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Versions the GitHub workflows run with. PaddlePaddle 3.2: 3.3.0/3.3.1 cannot run text detection or
# layout with oneDNN, without which every model is 5-15 times slower on CPU.
paddle = ["paddlepaddle==3.2.2", "paddleocr[doc-parser]==3.7.0", "rapidfuzz>=3.0"]
dev = ["pytest>=8.0", "rapidfuzz>=3.0"]

[project.scripts]
docextract = "docextract.cli:main"

[tool.setuptools.packages.find]
include = ["docextract*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
