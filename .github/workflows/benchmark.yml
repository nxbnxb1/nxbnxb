name: Benchmark

# Phase 2: measure CER/WER, table TEDS, heading F1, time/page, VLM calls and cost/page
# on documents with ground truth (<name>.gt.md next to each document).
# Empty dataset = the generated demo documents (scripts/make_samples.py).

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: Folder with documents + <name>.gt.md (empty = demo documents)
        default: ""
      model_tag:
        description: Vietnamese OCR release tag (empty = newest vi-ocr-* release)
        default: ""
      compare_stock_ocr:
        description: Also run with the stock PaddleOCR recogniser for comparison
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install docextract with PaddleOCR
        run: pip install -e ".[paddle]"

      - name: Cache PaddleOCR models
        uses: actions/cache@v4
        with:
          path: ~/.paddlex/official_models
          key: paddlex-models-${{ runner.os }}-v1

      - name: Dataset
        run: |
          if [ -z "${{ inputs.dataset }}" ]; then
            python scripts/make_samples.py samples
            echo "DATASET=samples" >> "$GITHUB_ENV"
          else
            echo "DATASET=${{ inputs.dataset }}" >> "$GITHUB_ENV"
          fi

      - name: Benchmark with the stock PaddleOCR recogniser
        if: inputs.compare_stock_ocr
        run: |
          python -m docextract bench "$DATASET" -o bench/stock
          { echo "## Stock PaddleOCR recogniser"; cat bench/stock/benchmark.md; } >> "$GITHUB_STEP_SUMMARY"

      - name: Vietnamese OCR model from Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/fetch_ocr_model.sh "${{ inputs.model_tag }}"

      - name: Benchmark with the Vietnamese recogniser
        if: env.DOCEXTRACT_OCR_REC_MODEL_DIR != ''
        env:
          DOCEXTRACT_VLM_BASE_URL: ${{ secrets.DOCEXTRACT_VLM_BASE_URL }}
          DOCEXTRACT_VLM_API_KEY: ${{ secrets.DOCEXTRACT_VLM_API_KEY }}
          DOCEXTRACT_VLM_MODEL: ${{ vars.DOCEXTRACT_VLM_MODEL || 'Qwen/Qwen2.5-VL-7B-Instruct' }}
        run: |
          python -m docextract bench "$DATASET" -o bench/vi_en
          { echo "## Vietnamese + English recogniser"; cat bench/vi_en/benchmark.md; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-${{ github.run_number }}
          path: bench/
