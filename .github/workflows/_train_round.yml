name: _train_round (reusable)

# One round of training on several runners at once (local SGD): every runner starts from the same
# weights (round 1: the prepared initial weights, later rounds: the previous average), trains on
# its own fresh synthetic lines for round_minutes, then the weights of all runners are averaged.
# Called by _train.yml; artifacts: r<round>-shard-<n> (one runner) and avg-r<round> (average).

on:
  workflow_call:
    inputs:
      product:
        type: string
        required: true
      round:
        type: number
        required: true
      previous:
        type: string  # artifact with the weights to start from (empty in round 1)
        default: ""
      rounds:
        type: number
        required: true
      shards:
        type: string  # JSON list of shard numbers
        required: true
      round_minutes:
        type: number
        required: true
      lines:
        type: number
        required: true

permissions:
  contents: read

env:
  PADDLEOCR_REF: dab3fe35379033fdcb2d0e9572fac0b36c9a9ebf
  WORK: ${{ github.workspace }}/vi_ocr_work
  PADDLEOCR_DIR: ${{ github.workspace }}/PaddleOCR
  LANGS: ${{ inputs.product == 'vi_en_ja' && 'vi,en,ja' || 'vi,en' }}

jobs:
  shard:
    runs-on: ubuntu-latest
    continue-on-error: true  # a lost runner only removes its share from the average
    timeout-minutes: 150  # round_minutes (at most 100) + setup, data and upload
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.shards) }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/ocr-train-setup
        with:
          paddleocr-ref: ${{ env.PADDLEOCR_REF }}
          paddleocr-dir: ${{ env.PADDLEOCR_DIR }}

      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.product }}-prep
          path: ${{ env.WORK }}

      - uses: actions/download-artifact@v4
        if: inputs.previous != ''
        with:
          name: ${{ inputs.previous }}
          path: ${{ env.WORK }}/start

      - name: Train (round ${{ inputs.round }}/${{ inputs.rounds }}, runner ${{ matrix.shard }})
        run: |
          source "$WORK/model.env"  # FUSE, FREEZE, GTC, LR of this training
          if [ -s "$WORK/start/avg.pdparams" ]; then export INIT_PARAMS="$WORK/start/avg.pdparams"
          elif [ -s "$WORK/resume/weights.pdparams" ]; then export INIT_PARAMS="$WORK/resume/weights.pdparams"; fi
          # constant LR per round, cosine over the rounds; warm-up at the start of every round
          # because each runner starts with a fresh optimizer
          export LR=$(python -c "import math; r, n, lr = ${{ inputs.round }}, ${{ inputs.rounds }}, $LR; print(f'{lr * 0.5 * (1 + math.cos(math.pi * (r - 0.5) / n)):.6g}')")
          export LR_CONST=1 NO_EVAL=1 WARMUP=${{ inputs.round == 1 && '0.1' || '0.03' }}
          export FUSE FREEZE GTC
          SAMPLES=${{ inputs.lines }} CHUNK=${{ inputs.lines }} EPOCHS=100 BATCH=32 PRINT_STEP=10 \
          SEED=$(( ${{ inputs.round }} * 1000 + ${{ matrix.shard }} )) TIME_BUDGET_MIN=${{ inputs.round_minutes }} \
            training/vi_ocr/run_training.sh train
          grep -E "avg_batch_cost" "$WORK/output/train.log" | tail -1 || true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.product }}-r${{ inputs.round }}-shard-${{ matrix.shard }}
          path: ${{ env.WORK }}/output/final.pdparams
          retention-days: 7

  average:
    needs: shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/ocr-train-setup
        with:
          paddleocr-ref: ${{ env.PADDLEOCR_REF }}
          paddleocr-dir: ${{ env.PADDLEOCR_DIR }}

      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.product }}-prep
          path: ${{ env.WORK }}

      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.product }}-r${{ inputs.round }}-shard-*
          path: shards

      - name: Average the runners' weights
        run: |
          mkdir -p avg
          found=$(ls shards/*/final.pdparams | wc -l)
          wanted=$(python -c 'import json; print(len(json.loads("""${{ inputs.shards }}""")))')
          echo "$found of $wanted runners finished the round"
          [ $((found * 2)) -ge "$wanted" ] || { echo "::error::fewer than half of the runners finished"; exit 1; }
          python training/vi_ocr/average_params.py avg/avg.pdparams shards/*/final.pdparams

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.product }}-avg-r${{ inputs.round }}
          path: avg/avg.pdparams
          retention-days: 7

      - name: Validation after round ${{ inputs.round }}
        continue-on-error: true
        run: |
          source "$WORK/model.env"
          export FUSE
          EXPORT_PARAMS="$GITHUB_WORKSPACE/avg/avg.pdparams" training/vi_ocr/run_training.sh export
          sets=()
          for lang in ${LANGS//,/ }; do sets+=("$WORK/data/val_$lang"); done
          (cd training/vi_ocr && python evaluate.py --eval "${sets[@]}" --model "round ${{ inputs.round }}=$WORK/export" \
            --model-name "$BASE_MODEL" --report "$WORK/val.md")
          { echo "### ${{ inputs.product }}: round ${{ inputs.round }}/${{ inputs.rounds }} (validation lines)"; cat "$WORK/val.md"; } >> "$GITHUB_STEP_SUMMARY"
