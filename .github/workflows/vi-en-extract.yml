name: "Việt + Anh · Extract documents"

# Product vi_en. Push PDF / Word / scanned images into inputs/vi_en/ (or run manually):
# outputs/vi_en/<name>.md, <name>.json and <name>_assets/*.png are committed back.

on:
  push:
    paths: ["inputs/vi_en/**"]
  workflow_dispatch:
    inputs:
      path:
        description: File or folder to convert (empty = inputs/vi_en)
        default: ""
      pages:
        description: Pages, e.g. 1-3,5 (empty = all)
        default: ""
      model_tag:
        description: Release of the fine-tuned model (empty = newest vi_en model)
        default: ""
      demo:
        description: Convert the generated demo documents instead
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  extract:
    uses: ./.github/workflows/_extract.yml
    with:
      product: vi_en
      path: ${{ inputs.path || '' }}
      pages: ${{ inputs.pages || '' }}
      model_tag: ${{ inputs.model_tag || '' }}
      demo: ${{ inputs.demo == true }}
    secrets: inherit
