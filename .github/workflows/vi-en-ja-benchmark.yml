name: "Việt + Anh + Nhật · Benchmark"

# Product vi_en_ja: its baseline (stock PaddleOCR model) and its fine-tuned model on documents with
# ground truth. Empty dataset = the product's demo documents.

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: Folder with documents + <name>.gt.md (empty = demo documents)
        default: ""
      vlm:
        description: "VLM for pictures: local (free, on the runner), api (secrets), none"
        type: choice
        options: [local, api, none]
        default: local
      model_tag:
        description: Release of the fine-tuned model (empty = newest vi_en_ja model)
        default: ""

permissions:
  contents: read

jobs:
  bench:
    uses: ./.github/workflows/_benchmark.yml
    with:
      product: vi_en_ja
      dataset: ${{ inputs.dataset }}
      model_tag: ${{ inputs.model_tag }}
      vlm: ${{ inputs.vlm }}
    secrets: inherit
