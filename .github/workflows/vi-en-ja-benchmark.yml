name: "Việt + Anh + Nhật · Benchmark"

# Product vi_en_ja: its baseline (stock PaddleOCR model) and its fine-tuned model on documents with
# ground truth, per category (see _benchmark.yml).

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: "eval (held-out set), demo, or a folder with documents + <name>.gt.md"
        default: eval
      split:
        description: "test (report), dev (tuning) or all"
        type: choice
        options: [test, dev, all]
        default: test
      vlm:
        description: "VLM: none, local (free but ~2 min per picture on the runner), api (secrets)"
        type: choice
        options: [none, local, api]
        default: none
      parts:
        description: "documents and text lines, or one of them"
        type: choice
        options: [all, documents, lines]
        default: all
      systems:
        description: "systems to run: all, or a comma-separated subset (e.g. ppstructure,tesseract)"
        default: all
      model_tag:
        description: Release of the fine-tuned model (empty = newest vi_en_ja model)
        default: ""

permissions:
  contents: read

jobs:
  bench:
    uses: ./.github/workflows/_benchmark.yml
    with:
      product: vi_en_ja
      dataset: ${{ inputs.dataset }}
      split: ${{ inputs.split }}
      model_tag: ${{ inputs.model_tag }}
      vlm: ${{ inputs.vlm }}
      documents: ${{ inputs.parts != 'lines' }}
      lines: ${{ inputs.parts != 'documents' }}
      systems: ${{ inputs.systems }}
    secrets: inherit
