name: _extract (reusable)

# Converts documents for one product: inputs/<product>/<name>.<ext> → outputs/<product>/<name>.md,
# <name>.json and <name>_assets/*.png (pictures text cannot replace), committed back to the branch
# and attached as an artifact. Called by "Việt + Anh · Extract" and "Việt + Anh + Nhật · Extract".
#
# VLM (pictures, charts, difficult tables), input "vlm":
#   local (default)  free: open-source Qwen2.5-VL 3B served by Ollama on the runner itself
#   api              an OpenAI-compatible endpoint from secrets.DOCEXTRACT_VLM_BASE_URL /
#                    secrets.DOCEXTRACT_VLM_API_KEY / vars.DOCEXTRACT_VLM_MODEL
#   none             no VLM: pictures are kept as image files (text is always OCR / PDF text layer)

on:
  workflow_call:
    inputs:
      product:
        type: string
        required: true
      path:
        type: string
        default: ""
      pages:
        type: string
        default: ""
      model_tag:
        type: string
        default: ""
      demo:
        type: boolean
        default: false
      vlm:
        type: string
        default: local

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    concurrency:
      group: extract-${{ inputs.product }}-${{ github.ref }}
      cancel-in-progress: false
    env:
      PRODUCT: ${{ inputs.product }}
      DOCEXTRACT_PRODUCT: ${{ inputs.product }}
      OUT: outputs/${{ inputs.product }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Files to convert
        id: files
        run: |
          if [ "${{ inputs.demo }}" = "true" ]; then
            printf '%s\n' samples/bao_cao_digital.pdf samples/bao_cao_scan.pdf samples/bao_cao.docx samples/hinh_anh.pdf > files.txt
            if [ "$PRODUCT" = "vi_en_ja" ]; then
              printf '%s\n' samples/houkoku_digital.pdf samples/houkoku_scan.pdf >> files.txt
            fi
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            target="${{ inputs.path }}"
            target="${target:-inputs/$PRODUCT}"
            if [ -d "$target" ]; then
              find "$target" -type f ! -name '.gitkeep' > files.txt
            else
              echo "$target" > files.txt
            fi
          else
            before="${{ github.event.before }}"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              git ls-files "inputs/$PRODUCT" > files.txt
            else
              git diff --name-only --diff-filter=AM "$before" "${{ github.sha }}" -- "inputs/$PRODUCT" > files.txt
            fi
            grep -v '/\.gitkeep$' files.txt > filtered.txt || true
            mv filtered.txt files.txt
          fi
          echo "Files:"; cat files.txt
          echo "count=$(grep -c . files.txt || true)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.files.outputs.count != '0'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install docextract with PaddleOCR
        if: steps.files.outputs.count != '0'
        run: |
          pip install -e ".[paddle]"
          # any non-PDF/DOCX/image format is converted by LibreOffice
          if grep -qviE '\.(pdf|docx|png|jpe?g|tiff?|bmp|webp)$' files.txt; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq libreoffice-writer-nogui libreoffice-calc-nogui libreoffice-impress-nogui >/dev/null
          fi

      - name: Demo documents
        if: inputs.demo
        run: python scripts/make_samples.py samples --product "$PRODUCT"

      - name: Cache PaddleOCR models
        if: steps.files.outputs.count != '0'
        uses: actions/cache@v4
        with:
          path: ~/.paddlex/official_models
          key: paddlex-models-${{ runner.os }}-v1

      - name: Cache local VLM
        if: steps.files.outputs.count != '0' && inputs.vlm == 'local'
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-${{ vars.DOCEXTRACT_LOCAL_VLM || 'qwen2.5vl:3b' }}-v1

      - name: Free local VLM (Ollama)
        if: steps.files.outputs.count != '0' && inputs.vlm == 'local'
        continue-on-error: true  # without a VLM pictures are simply kept
        run: scripts/start_local_vlm.sh "${{ vars.DOCEXTRACT_LOCAL_VLM || 'qwen2.5vl:3b' }}"

      - name: OCR model of the product from Releases
        if: steps.files.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/fetch_ocr_model.sh "$PRODUCT" "${{ inputs.model_tag }}"

      - name: Convert
        if: steps.files.outputs.count != '0'
        env:
          DOCEXTRACT_VLM_BASE_URL: ${{ inputs.vlm == 'api' && secrets.DOCEXTRACT_VLM_BASE_URL || env.DOCEXTRACT_VLM_BASE_URL }}
          DOCEXTRACT_VLM_API_KEY: ${{ inputs.vlm == 'api' && secrets.DOCEXTRACT_VLM_API_KEY || '' }}
          DOCEXTRACT_VLM_MODEL: ${{ inputs.vlm == 'api' && (vars.DOCEXTRACT_VLM_MODEL || 'Qwen/Qwen2.5-VL-7B-Instruct') || env.DOCEXTRACT_VLM_MODEL }}
          DOCEXTRACT_CACHE_DIR: ${{ github.workspace }}/.docextract_cache
          DOCEXTRACT_ROUTE_LOG_PATH: ${{ github.workspace }}/${{ env.OUT }}/route_log.jsonl
        run: |
          args=()
          [ -n "${{ inputs.pages }}" ] && args+=(--pages "${{ inputs.pages }}")
          mapfile -t files < files.txt
          python -m docextract -v extract "${files[@]}" -o "$OUT" "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: steps.files.outputs.count != '0'
        with:
          name: outputs-${{ inputs.product }}-${{ github.run_number }}
          path: ${{ env.OUT }}/

      - name: Commit outputs
        if: steps.files.outputs.count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT"
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Extract ($PRODUCT): $(wc -l < files.txt) document(s) from run ${{ github.run_number }}"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
