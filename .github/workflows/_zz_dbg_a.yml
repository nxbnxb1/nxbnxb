name: _zz_dbg_a (reusable)

# Fine-tunes the PP-OCRv5 recogniser of one product on synthetic text lines so it reads
# Vietnamese (stock PaddleOCR dictionaries lack most Vietnamese letters with stacked diacritics)
# while keeping English and, for vi_en_ja, Japanese.
#
# A GitHub runner has 4 CPU cores and no GPU, so training runs on several runners at once in
# rounds (local SGD): in each round every runner starts from the same weights, trains on its own
# fresh synthetic lines, and the weights of all runners are averaged (jobs shard-rK / average-rK,
# written by scripts/gen_train_rounds.py). After the last round the average is exported,
# evaluated against the product's own baseline (the stock model it starts from) and published as
# the Release "<product>-ocr-<run>", which the product's Extract/Benchmark workflows download.

on:
  workflow_call:
    inputs:
      product:
        type: string
        required: true
      runners:
        type: number
        default: 8
      rounds:
        type: number  # 1 to 6
        default: 4
      round_minutes:
        type: number  # at most 100
        default: 50
      lines:
        type: number  # new synthetic lines per runner and round (~9 lines/s are trained)
        default: 24000
      resume_tag:
        type: string
        default: ""
      publish:
        type: boolean
        default: true

permissions:
  contents: write

env:
  PADDLEOCR_REF: dab3fe35379033fdcb2d0e9572fac0b36c9a9ebf  # training code, pinned
  WORK: ${{ github.workspace }}/vi_ocr_work
  PADDLEOCR_DIR: ${{ github.workspace }}/PaddleOCR
  LANGS: ${{ inputs.product == 'vi_en_ja' && 'vi,en,ja' || 'vi,en' }}
  # CPU settings measured by "OCR training · speed probe" (samples/s on a 4-core runner, batch 32):
  #   vi_en 1.0 as PaddleOCR trains → 2.4 fused backbone → 8.8 fused + CTC branch only
  #   vi_en_ja 0.8 → 1.6 → 7.1; freezing stages 1-4 adds little, so the whole backbone trains
  NEW_MODEL_FUSE: "1"  # continued weights keep their own setting
  FREEZE: ""
  GTC: "0"

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/ocr-train-setup
        with:
          paddleocr-ref: ${{ env.PADDLEOCR_REF }}
          paddleocr-dir: ${{ env.PADDLEOCR_DIR }}

      - name: Weights to continue from
        if: inputs.resume_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$WORK/resume_dl"
          gh release download "${{ inputs.resume_tag }}" -p "checkpoint.tar.gz" -D "$WORK/resume_dl"
          tar -xzf "$WORK/resume_dl/checkpoint.tar.gz" -C "$WORK/resume_dl"
          ckpt="$WORK/resume_dl/checkpoint"
          grep -q "NAME=${{ inputs.product }}_PP-OCRv5" "$ckpt/model.env" \
            || { echo "::error::${{ inputs.resume_tag }} is not a ${{ inputs.product }} model"; exit 1; }
          mkdir -p "$WORK/resume"
          weights=$(ls "$ckpt"/weights.pdparams "$ckpt"/latest.pdparams 2>/dev/null | head -1)
          cp "$weights" "$WORK/resume/weights.pdparams"
          # continued weights keep the dictionary and the structure (fused or not) they were trained with
          echo "RESUME_DICT=$ckpt/dict.txt" >> "$GITHUB_ENV"
          echo "RESUME_FUSE=$(sed -n 's/^FUSE=//p' "$ckpt/model.env" | head -1 | grep . || echo 0)" >> "$GITHUB_ENV"

      - name: Dictionary, initial weights, validation and evaluation lines
        env:
          FUSE: ${{ env.RESUME_FUSE || env.NEW_MODEL_FUSE }}
        run: |
          training/vi_ocr/run_training.sh prepare
          cat "$WORK/model.env"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.product }}-prep
          path: |
            ${{ env.WORK }}/model.env
            ${{ env.WORK }}/dict.txt
            ${{ env.WORK }}/pretrained/init.pdparams
            ${{ env.WORK }}/resume/
            ${{ env.WORK }}/data/
          retention-days: 7

      - id: plan
        run: echo "shards=$(python -c 'import json; print(json.dumps(list(range(1, ${{ inputs.runners }} + 1))))')" >> "$GITHUB_OUTPUT"

