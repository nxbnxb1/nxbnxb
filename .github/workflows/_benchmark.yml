name: _benchmark (reusable)

# Phase 2 for one product: the product (docextract with its fine-tuned recognition model) and
# several reasonable baselines on the same data, each on its own runner, one table at the end.
#
# Documents (CER, word F1, table TEDS, heading F1, ms/page, needs review; per category):
#   fine-tuned    docextract + the product's fine-tuned model (pinned Release, or model_tag)
#   stock         docextract + the stock PaddleOCR model the product is fine-tuned from
#   ppocrv6       docextract + PP-OCRv6_medium_rec (newest PaddleOCR generation)
#   ppstructure   PP-StructureV3, PaddleOCR's own document parser
#   tesseract     Tesseract 5 (tessdata_best) on every page, product languages
#   text_layer    text already in the file, no OCR (scans give nothing)
# Text lines (CER, line accuracy, Vietnamese letters, ms/line; synthetic lines per language):
#   fine-tuned, stock, PP-OCRv5_server_rec, PP-OCRv6_medium_rec, Tesseract 5, EasyOCR, VietOCR
# Speed: every system in turn on one runner, on a fixed sample (the accuracy jobs run on
#   different machines, too different in speed to compare their times).
# "fine-tuned" is the proposed system (PROPOSED in the reports): docextract + the product's model.
#
# dataset: eval (held-out set: enterprise documents of companies never trained on, from the
#          corpus of "Collect enterprise documents", as digital PDF and scan; newest "eval-set-*"
#          Release, Wikipedia articles of the product's languages as digital PDF / DOCX / scan;
#          OmniDocBench real pages of 9 kinds; split dev/test), demo (generated demo
#          documents), or a folder with <name>.gt.md files.

on:
  workflow_call:
    inputs:
      product:
        type: string
        required: true
      dataset:
        type: string
        default: eval
      split:
        type: string
        default: test
      omnidocbench_per_kind:
        type: string
        default: "6"
      model_tag:
        type: string
        default: ""
      vlm:
        type: string
        default: none
      documents:
        type: boolean
        default: true
      systems:
        type: string
        default: all  # or a comma-separated subset, e.g. "ppstructure,tesseract"
      shards:
        type: string
        default: "3"  # runners per system for the documents (each takes a part, results merged)
      lines:
        type: boolean
        default: true
      speed:
        type: boolean
        default: true

permissions:
  contents: read

env:
  PRODUCT: ${{ inputs.product }}
  DOCEXTRACT_PRODUCT: ${{ inputs.product }}
  PADDLEOCR_REF: dab3fe35379033fdcb2d0e9572fac0b36c9a9ebf
  WORK: ${{ github.workspace }}/vi_ocr_work
  PADDLEOCR_DIR: ${{ github.workspace }}/PaddleOCR

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      documents: ${{ steps.plan.outputs.documents }}
      lines: ${{ steps.plan.outputs.lines }}
      shards: ${{ steps.plan.outputs.shards }}
      shard_count: ${{ steps.plan.outputs.shard_count }}
    steps:
      - id: plan
        env:
          SYSTEMS: ${{ inputs.systems }}
          SHARDS: ${{ inputs.shards }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          documents = ["fine-tuned", "stock", "ppocrv6", "ppstructure", "tesseract", "text_layer"]
          lines = ["fine-tuned", "stock", "server", "ppocrv6", "tesseract", "easyocr", "vietocr"]
          wanted = {s.strip() for s in os.environ["SYSTEMS"].split(",") if s.strip()}
          if not wanted or "all" in wanted:
              wanted = set(documents) | set(lines)
          print("documents=" + json.dumps([s for s in documents if s in wanted]))
          print("lines=" + json.dumps([s for s in lines if s in wanted]))
          n = max(1, int(os.environ["SHARDS"] or 1))
          print("shards=" + json.dumps(list(range(1, n + 1))))
          print(f"shard_count={n}")
          EOF

  dataset:
    needs: plan
    if: (inputs.documents || inputs.speed) && needs.plan.outputs.documents != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e . lxml httpx

      - uses: ./.github/actions/enterprise-corpus
        if: inputs.dataset == 'eval'
        with:
          splits: dev,test

      - name: Documents with ground truth
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "${{ inputs.dataset }}" in
            ""|demo)
              python scripts/make_samples.py bench_data --product "$PRODUCT" ;;
            eval)
              tag=$(gh release list --limit 100 --json tagName --jq '[.[] | select(.tagName | startswith("eval-set-"))][0].tagName')
              if [ -n "$tag" ]; then
                gh release download "$tag" -p eval_wikipedia.tar.gz && tar -xzf eval_wikipedia.tar.gz
                mv eval bench_data
                echo "Wikipedia part: $tag" | tee -a "$GITHUB_STEP_SUMMARY"
              else
                echo "::warning::no eval-set release yet: run 'Build evaluation set' first (OmniDocBench only)"
              fi
              python scripts/build_eval_set.py omnidocbench bench_data --per-kind "${{ inputs.omnidocbench_per_kind }}"
              langs=$(python -c "from docextract.products import PRODUCTS; print(' '.join(PRODUCTS['$PRODUCT'].languages))")
              if [ -n "${CORPUS_MANIFEST:-}" ]; then  # enterprise documents of the held-out companies
                python scripts/build_eval_set.py enterprise bench_data --manifest "$CORPUS_MANIFEST" --files "$CORPUS_FILES" \
                  --langs "${langs// /,}"
              fi
              for dir in bench_data/*/wiki_*; do
                [ -d "$dir" ] || continue
                lang=${dir##*/wiki_}
                [[ " $langs " == *" $lang "* ]] || rm -rf "$dir"  # only the product's languages
              done ;;
            *)
              cp -r "${{ inputs.dataset }}" bench_data ;;
          esac
          find bench_data -name '*.gt.md' | sed 's#/[^/]*$##' | sort | uniq -c | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: bench-data-${{ inputs.product }}
          path: bench_data/
          retention-days: 7

  documents:
    needs: [plan, dataset]
    if: inputs.documents
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        system: ${{ fromJSON(needs.plan.outputs.documents) }}
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          case "${{ matrix.system }}" in
            text_layer) pip install -e . ;;
            *) pip install -e ".[paddle]" ;;
          esac
          case "${{ matrix.system }}" in  # the OCR tools read DOCX converted to PDF by LibreOffice
            tesseract|ppstructure)
              sudo apt-get update -qq
              sudo apt-get install -y -qq libreoffice-writer-nogui >/dev/null ;;
          esac

      - name: Tesseract 5 (tessdata_best)
        if: matrix.system == 'tesseract'
        run: scripts/fetch_tessdata.sh "$(python -c "from docextract.products import PRODUCTS; print(PRODUCTS['$PRODUCT'].tesseract_langs)")"

      - name: Cache PaddleOCR models
        if: matrix.system != 'tesseract' && matrix.system != 'text_layer'
        uses: actions/cache@v4
        with:
          path: ~/.paddlex/official_models
          key: paddlex-models-${{ runner.os }}-v1

      - name: Fine-tuned model of the product from Releases
        if: matrix.system == 'fine-tuned'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/fetch_ocr_model.sh "$PRODUCT" "${{ inputs.model_tag }}"

      - name: Cache local VLM
        if: inputs.vlm == 'local' && (matrix.system == 'fine-tuned' || matrix.system == 'stock' || matrix.system == 'ppocrv6')
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-${{ vars.DOCEXTRACT_LOCAL_VLM || 'qwen2.5vl:3b' }}-v1

      - name: Free local VLM (Ollama)
        if: inputs.vlm == 'local' && (matrix.system == 'fine-tuned' || matrix.system == 'stock' || matrix.system == 'ppocrv6')
        continue-on-error: true
        run: scripts/start_local_vlm.sh "${{ vars.DOCEXTRACT_LOCAL_VLM || 'qwen2.5vl:3b' }}"

      - uses: actions/download-artifact@v4
        with:
          name: bench-data-${{ inputs.product }}
          path: bench_data

      # results are saved after every document; the step limit leaves time to upload them
      - name: Benchmark ${{ matrix.system }} (part ${{ matrix.shard }} of ${{ needs.plan.outputs.shard_count }})
        timeout-minutes: 320
        env:
          DOCEXTRACT_VLM_BASE_URL: ${{ inputs.vlm == 'api' && secrets.DOCEXTRACT_VLM_BASE_URL || env.DOCEXTRACT_VLM_BASE_URL }}
          DOCEXTRACT_VLM_API_KEY: ${{ inputs.vlm == 'api' && secrets.DOCEXTRACT_VLM_API_KEY || '' }}
          DOCEXTRACT_VLM_MODEL: ${{ inputs.vlm == 'api' && (vars.DOCEXTRACT_VLM_MODEL || 'Qwen/Qwen2.5-VL-7B-Instruct') || env.DOCEXTRACT_VLM_MODEL }}
        run: |
          split=()
          case "${{ inputs.split }}" in dev|test) split=(--split "${{ inputs.split }}") ;; esac
          [ "${{ inputs.vlm }}" = none ] && split+=(--no-vlm)
          scripts/bench_system.sh "${{ matrix.system }}" bench_data "bench/${{ matrix.system }}" "${split[@]}" \
            --shard "${{ matrix.shard }}/${{ needs.plan.outputs.shard_count }}"

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: bench-docs-${{ inputs.product }}-${{ matrix.system }}-${{ matrix.shard }}
          path: bench/
          if-no-files-found: ignore

  lines-data:
    needs: plan
    if: (inputs.lines || inputs.speed) && needs.plan.outputs.lines != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/ocr-train-setup
        with:
          paddleocr-ref: ${{ env.PADDLEOCR_REF }}
          paddleocr-dir: ${{ env.PADDLEOCR_DIR }}

      - uses: ./.github/actions/enterprise-corpus
        with:
          splits: dev,test

      - name: Evaluation lines (same seeds as the evaluation after training)
        env:
          LANGS: ${{ inputs.product == 'vi_en_ja' && 'vi,en,ja' || 'vi,en' }}
          EVAL_COUNT: "1000"
          VAL_COUNT: "1"
        run: training/vi_ocr/run_training.sh prepare

      - uses: actions/upload-artifact@v4
        with:
          name: bench-lines-data-${{ inputs.product }}
          path: |
            ${{ env.WORK }}/data/eval_*/
          retention-days: 7

  lines:
    needs: [plan, lines-data]
    if: inputs.lines
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        system: ${{ fromJSON(needs.plan.outputs.lines) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -e . rapidfuzz
          case "${{ matrix.system }}" in
            easyocr|vietocr)
              pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
              pip install "${{ matrix.system }}" "setuptools<81" ;;  # VietOCR imports pkg_resources
            tesseract) ;;
            *) pip install -e ".[paddle]" ;;
          esac

      - name: Tesseract 5 (tessdata_best)
        if: matrix.system == 'tesseract'
        run: scripts/fetch_tessdata.sh "$(python -c "from docextract.products import PRODUCTS; print(PRODUCTS['$PRODUCT'].tesseract_langs)")"

      - name: Fine-tuned model of the product from Releases
        if: matrix.system == 'fine-tuned'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/fetch_ocr_model.sh "$PRODUCT" "${{ inputs.model_tag }}"

      - uses: actions/download-artifact@v4
        with:
          name: bench-lines-data-${{ inputs.product }}
          path: lines_data

      - name: Evaluate ${{ matrix.system }}
        run: |
          system="$(scripts/line_system_spec.sh "${{ matrix.system }}")"
          if [ -z "$system" ]; then echo "no fine-tuned model yet"; exit 0; fi
          mkdir -p lines
          (cd training/vi_ocr && python evaluate.py --eval "$GITHUB_WORKSPACE"/lines_data/eval_* --system "$system" \
            --json "$GITHUB_WORKSPACE/lines/${{ matrix.system }}.json" --report "$GITHUB_WORKSPACE/lines/${{ matrix.system }}.md")

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: bench-lines-${{ inputs.product }}-${{ matrix.system }}
          path: lines/
          if-no-files-found: ignore

  # Accuracy jobs run on different machines, whose speed differs by up to 50%: speed is measured
  # here, every system in turn on the same runner, on a fixed sample (one enterprise document per
  # category, 200 lines of each set of real document lines).
  speed:
    needs: [plan, dataset, lines-data]
    if: ${{ !cancelled() && inputs.speed && (needs.dataset.result == 'success' || needs.lines-data.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install every system
        run: |
          pip install -e ".[paddle]" rapidfuzz
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install easyocr vietocr "setuptools<81"  # VietOCR imports pkg_resources
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer-nogui >/dev/null
          scripts/fetch_tessdata.sh "$(python -c "from docextract.products import PRODUCTS; print(PRODUCTS['$PRODUCT'].tesseract_langs)")"

      - name: Cache PaddleOCR models
        uses: actions/cache@v4
        with:
          path: ~/.paddlex/official_models
          key: paddlex-models-${{ runner.os }}-v1

      - name: Fine-tuned model of the product from Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/fetch_ocr_model.sh "$PRODUCT" "${{ inputs.model_tag }}"

      - uses: actions/download-artifact@v4
        if: needs.dataset.result == 'success'
        with:
          name: bench-data-${{ inputs.product }}
          path: bench_data

      - uses: actions/download-artifact@v4
        if: needs.lines-data.result == 'success'
        with:
          name: bench-lines-data-${{ inputs.product }}
          path: lines_data

      - name: Documents, every system on this runner
        if: needs.dataset.result == 'success'
        timeout-minutes: 200
        continue-on-error: true
        env:
          SYSTEMS: ${{ needs.plan.outputs.documents }}
        run: |
          split=()
          case "${{ inputs.split }}" in dev|test) split=(--split "${{ inputs.split }}") ;; esac
          for system in $(python -c 'import json, os; print(" ".join(json.loads(os.environ["SYSTEMS"])))'); do
            scripts/bench_system.sh "$system" bench_data "speed/documents/$system" "${split[@]}" --no-vlm \
              --categories enterprise --per-category 1 || echo "::warning::$system failed"
          done

      - name: Text lines, every system on this runner
        if: needs.lines-data.result == 'success'
        timeout-minutes: 80
        continue-on-error: true
        env:
          SYSTEMS: ${{ needs.plan.outputs.lines }}
        run: |
          systems=()
          for system in $(python -c 'import json, os; print(" ".join(json.loads(os.environ["SYSTEMS"])))'); do
            spec="$(scripts/line_system_spec.sh "$system")"
            [ -n "$spec" ] && systems+=(--system "$spec")
          done
          mkdir -p speed
          (cd training/vi_ocr && python evaluate.py --eval "$GITHUB_WORKSPACE"/lines_data/eval_real_* --limit 200 \
            "${systems[@]}" --json "$GITHUB_WORKSPACE/speed/lines.json" --report "$GITHUB_WORKSPACE/speed/lines.md")

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: bench-speed-${{ inputs.product }}
          path: speed/
          if-no-files-found: ignore

  report:
    needs: [documents, lines, speed]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e . rapidfuzz

      - uses: actions/download-artifact@v4
        with:
          pattern: bench-*-${{ inputs.product }}-*
          path: results

      - uses: actions/download-artifact@v4
        continue-on-error: true  # no speed job when it was skipped
        with:
          name: bench-speed-${{ inputs.product }}
          path: results/bench-speed-${{ inputs.product }}

      - name: One table for all systems
        run: |
          mkdir -p report merged
          reports=()
          for system in fine-tuned stock ppocrv6 ppstructure tesseract text_layer; do
            parts=(results/bench-docs-$PRODUCT-$system-*/$system/benchmark.json)
            [ -f "${parts[0]}" ] || continue
            python -m docextract bench-merge "${parts[@]}" -o "merged/$system"
            reports+=("merged/$system/benchmark.json")
          done
          {
            echo "# $PRODUCT: product vs baselines (same documents, split ${{ inputs.split }}, VLM ${{ inputs.vlm }})"
            echo
            echo "## Documents"
            echo
            if [ ${#reports[@]} -gt 0 ]; then
              python -m docextract compare "${reports[@]}"
              echo "Documents scored per system (a missing part of the documents shows here):"
              echo
              for f in "${reports[@]}"; do
                python -c "import json,sys; r=json.load(open(sys.argv[1])); s=r['summary']; print(f\"- {r['system']}: {s['documents']} documents, {s.get('failed', 0)} failed\")" "$f"
              done
            else
              echo "(no document results)"
            fi
          } > report/documents.md
          lines=$(ls results/bench-lines-$PRODUCT-*/*.json 2>/dev/null || true)
          if [ -n "$lines" ]; then
            (cd training/vi_ocr && python evaluate.py merge $(for f in $lines; do echo "$GITHUB_WORKSPACE/$f"; done) \
              --report "$GITHUB_WORKSPACE/report/lines.md" >/dev/null)
          fi
          python - > report/speed.md <<'EOF'
          import json, statistics
          from pathlib import Path
          print("## Speed, every system on the same runner (fixed sample)")
          print()
          docs = sorted(Path("results/bench-speed-${{ inputs.product }}/documents").glob("*/benchmark.json"))
          if docs:
              print("| system | documents | pages | s/page |")
              print("|---|---|---|---|")
              for f in docs:
                  r = json.loads(f.read_text())
                  s = r["summary"]
                  ms = s.get("ms_per_page")
                  print(f"| {r['system']} | {s['documents']} | {s['pages']} | {ms / 1000:.1f} |" if ms else f"| {r['system']} | {s['documents']} | {s['pages']} | - |")
              print()
          lines = Path("results/bench-speed-${{ inputs.product }}/lines.json")
          if lines.exists():
              data = json.loads(lines.read_text())
              results = data.get("results", data)
              by_system = {}
              for dataset, systems in results.items():
                  for name, m in systems.items():
                      if "ms_per_line" in m:
                          by_system.setdefault(name, []).append(m["ms_per_line"])
              print("| system (text lines) | ms/line (mean of the real-document sets) |")
              print("|---|---|")
              for name, values in sorted(by_system.items(), key=lambda kv: statistics.fmean(kv[1])):
                  print(f"| {name} | {statistics.fmean(values):.1f} |")
          if not docs and not lines.exists():
              print("(no speed results)")
          EOF
          cat report/documents.md >> "$GITHUB_STEP_SUMMARY"
          { echo; cat report/speed.md; } >> "$GITHUB_STEP_SUMMARY"
          [ -f report/lines.md ] && { echo; cat report/lines.md; } >> "$GITHUB_STEP_SUMMARY"
          true

      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ inputs.product }}-${{ github.run_number }}
          path: |
            report/
            merged/
            results/
