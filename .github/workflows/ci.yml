name: CI

on:
  push:
    paths-ignore: ["outputs/**", "inputs/**", "**.md"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (without PaddleOCR; tests use fake engines)
        run: pip install -e ".[dev]"
      - name: Tests
        run: pytest -q
