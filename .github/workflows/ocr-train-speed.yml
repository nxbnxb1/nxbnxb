name: OCR training · speed probe

# How fast does the OCR recogniser train on a GitHub CPU runner? Nothing is published.
#   mode=profile  where one training step spends its time (each backbone stage, heads, loss,
#                 backward), with and without the training-time branches of the backbone, and
#                 the speed of its convolutions in Paddle (with/without oneDNN) and PyTorch
#   mode=train    real training for a few minutes per setting, all settings in parallel; the
#                 summary table gives samples/s and passes over the training set per full job

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        default: profile
        options: [profile, train]
      products:
        description: products to measure
        type: choice
        default: both
        options: [both, vi_en, vi_en_ja]
      minutes:
        description: training minutes per setting
        default: "10"

permissions:
  contents: read

env:
  PADDLEOCR_REF: dab3fe35379033fdcb2d0e9572fac0b36c9a9ebf
  WORK: ${{ github.workspace }}/vi_ocr_work
  PADDLEOCR_DIR: ${{ github.workspace }}/PaddleOCR

jobs:
  profile:
    if: inputs.mode == 'profile'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        product: ${{ fromJSON(inputs.products == 'both' && '["vi_en","vi_en_ja"]' || format('["{0}"]', inputs.products)) }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/ocr-train-setup
        with:
          paddleocr-ref: ${{ env.PADDLEOCR_REF }}
          paddleocr-dir: ${{ env.PADDLEOCR_DIR }}

      - name: PyTorch (CPU) for comparison
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Profile one training step
        env:
          FLAGS_paddle_num_threads: "4"
          OMP_NUM_THREADS: "4"
        run: |
          dicts="$PADDLEOCR_DIR/ppocr/utils/dict"
          if [ "${{ matrix.product }}" = vi_en_ja ]; then
            python training/vi_ocr/charset.py dict.txt --langs vi,en,ja --base-dict "$dicts/ppocrv5_dict.txt"
          else
            python training/vi_ocr/charset.py dict.txt --langs vi,en
          fi
          classes=$(( $(wc -l < dict.txt) + 2 ))  # + CTC blank + space
          cd "$PADDLEOCR_DIR"
          python "$GITHUB_WORKSPACE/training/vi_ocr/profile_cpu.py" -c "$GITHUB_WORKSPACE/training/vi_ocr/vi_en_PP-OCRv5_mobile_rec.yml" \
            --classes "$classes" --batch 32 --torch | tee profile.md
          { echo "## ${{ matrix.product }} ($classes classes)"; cat profile.md; } >> "$GITHUB_STEP_SUMMARY"

  probe:
    if: inputs.mode == 'train'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        product: ${{ fromJSON(inputs.products == 'both' && '["vi_en","vi_en_ja"]' || format('["{0}"]', inputs.products)) }}
        variant:
          - {name: "all cores (reference)", fuse: "0", freeze: "", gtc: "1"}
          - {name: "fused", fuse: "1", freeze: "", gtc: "1"}
          - {name: "fused + CTC only", fuse: "1", freeze: "", gtc: "0"}
          - {name: "fused + frozen stages 1-4", fuse: "1", freeze: "conv1,blocks2,blocks3,blocks4", gtc: "1"}
          - {name: "fused + frozen stages 1-4 + CTC only", fuse: "1", freeze: "conv1,blocks2,blocks3,blocks4", gtc: "0"}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/ocr-train-setup
        with:
          paddleocr-ref: ${{ env.PADDLEOCR_REF }}
          paddleocr-dir: ${{ env.PADDLEOCR_DIR }}

      - name: Train for ${{ inputs.minutes }} minutes
        env:
          LANGS: ${{ matrix.product == 'vi_en_ja' && 'vi,en,ja' || 'vi,en' }}
          SAMPLES: "2000"
          CHUNK: "2000"
          EPOCHS: "100"
          VAL_COUNT: "50"
          EVAL_COUNT: "20"
          BATCH: "32"
          PRINT_STEP: "1"
          TIME_BUDGET_MIN: ${{ inputs.minutes }}
          PROBE: "1"
          FUSE: ${{ matrix.variant.fuse }}
          FREEZE: ${{ matrix.variant.freeze }}
          GTC: ${{ matrix.variant.gtc }}
        run: training/vi_ocr/run_training.sh  # THREADS empty = all cores

      - name: Result
        if: always()
        id: result
        run: |
          slug=$(echo "${{ matrix.product }}-${{ matrix.variant.name }}" | tr -c 'A-Za-z0-9-' '_')
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          mkdir -p speed
          python training/vi_ocr/speed_report.py one "$WORK/output/train.log" --variant "${{ matrix.variant.name }}" \
            --product "${{ matrix.product }}" --status "$(cat "$WORK/train_status" 2>/dev/null || echo -1)" \
            --out "speed/result_$slug.json"
          grep -E "train_cpu|Error|error" "$WORK/output/train.log" | tail -5 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: speed-${{ steps.result.outputs.slug }}
          path: speed/

  report:
    needs: probe
    if: always() && inputs.mode == 'train'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: speed-*
          path: speed
      - name: Table
        run: |
          {
            echo "## OCR training speed on a GitHub runner ($(nproc) cores)"
            echo
            python training/vi_ocr/speed_report.py table speed --samples 60000 --budget-min 290
            echo
            echo "exit 124/130 = stopped by the time limit as planned; any other code = the setting failed (see its job log)."
          } >> "$GITHUB_STEP_SUMMARY"
