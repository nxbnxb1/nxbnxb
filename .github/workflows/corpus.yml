name: Collect enterprise documents

# Builds the enterprise document corpus (scripts/collect_corpus.py): documents Vietnamese and
# Japanese listed companies publish themselves — financial statements, annual reports, AGM
# resolutions and minutes, disclosures, … in Vietnamese, English and Japanese. Commits the
# manifest (URL, checksum, company, type, language, digital/scan, split) to corpus/; the files
# stay in the Actions cache. Split by company: 70% train, 10% dev, 20% test.

on:
  workflow_dispatch:
    inputs:
      tdnet_days:
        description: Days of TDnet disclosures to list (TDnet keeps about one month)
        default: "30"
      per_company:
        description: Documents per company (spread over document types)
        default: "6"

permissions:
  contents: write

concurrency:
  group: corpus
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e . httpx

      - name: Corpus files from earlier runs
        uses: actions/cache/restore@v4
        with:
          path: corpus_files
          key: corpus-files-v1-${{ github.run_id }}
          restore-keys: corpus-files-v1-

      - name: Vietnamese companies (investor relations pages)
        run: python scripts/collect_corpus.py crawl-vn corpus/seeds_vn.tsv candidates/vn.jsonl

      - name: Japanese companies (TDnet)
        run: python scripts/collect_corpus.py tdnet candidates/jp.jsonl --days "${{ inputs.tdnet_days }}"

      - name: Select, download and inspect
        run: |
          python scripts/collect_corpus.py download candidates/vn.jsonl candidates/jp.jsonl \
            --dir corpus_files --manifest corpus/manifest.jsonl --per-company "${{ inputs.per_company }}" --max-mb 20
          {
            echo "# Enterprise document corpus"
            echo
            echo "Built by run ${{ github.run_id }} on $(date -u +%Y-%m-%d). Files are not stored in the repository:"
            echo "\`python scripts/collect_corpus.py fetch corpus/manifest.jsonl --dir corpus_files\` downloads them"
            echo "from the companies' own publications (checksums verified)."
            echo
            python scripts/collect_corpus.py stats corpus/manifest.jsonl
          } > corpus/STATS.md
          cat corpus/STATS.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/cache/save@v4
        with:
          path: corpus_files
          key: corpus-files-v1-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        with:
          name: corpus-candidates-${{ github.run_number }}
          path: candidates/

      - name: Commit the manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add corpus/manifest.jsonl corpus/STATS.md
          git diff --cached --quiet && exit 0
          git commit -m "Enterprise corpus manifest from run ${{ github.run_number }}"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
