name: _train (reusable)

# Fine-tunes the PP-OCRv5 recogniser of one product on synthetic text lines so it reads
# Vietnamese (stock PaddleOCR dictionaries lack most Vietnamese letters with stacked
# diacritics) while keeping English and, for vi_en_ja, Japanese. Evaluates against the
# product's own baseline (the stock model it starts from) and publishes a GitHub Release
# "<product>-ocr-<run>" that the product's Extract/Benchmark workflows download.

on:
  workflow_call:
    inputs:
      product:
        type: string
        required: true
      samples:
        type: string
        default: "60000"
      epochs:
        type: string
        default: "4"
      time_budget_minutes:
        type: string
        default: "290"
      resume_tag:
        type: string
        default: ""
      publish:
        type: boolean
        default: true

permissions:
  contents: write

env:
  PADDLEOCR_REF: dab3fe35379033fdcb2d0e9572fac0b36c9a9ebf  # training code, pinned
  WORK: ${{ github.workspace }}/vi_ocr_work
  PADDLEOCR_DIR: ${{ github.workspace }}/PaddleOCR

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Fonts with Vietnamese coverage
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core fonts-liberation2 fonts-freefont-ttf fonts-noto-core \
            fonts-crosextra-carlito fonts-crosextra-caladea fonts-roboto fonts-open-sans \
            fonts-noto-cjk fonts-ipaexfont-gothic fonts-ipaexfont-mincho >/dev/null

      - name: PaddleOCR training code
        run: |
          git init -q "$PADDLEOCR_DIR"
          git -C "$PADDLEOCR_DIR" fetch -q --depth 1 https://github.com/PaddlePaddle/PaddleOCR "$PADDLEOCR_REF"
          git -C "$PADDLEOCR_DIR" checkout -q FETCH_HEAD

      - name: Python packages
        run: |
          pip install "paddlepaddle==3.3.1" "paddleocr==3.7.0" wordfreq fonttools rapidfuzz
          pip install -r "$PADDLEOCR_DIR/requirements.txt"
          # albumentations pulls opencv-python-headless, which shadows the cv2 build PaddleX expects
          pip uninstall -y opencv-python-headless opencv-python || true
          pip install --force-reinstall --no-deps "opencv-contrib-python==4.10.0.84"

      - name: Resume checkpoint
        if: inputs.resume_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$WORK/resume"
          gh release download "${{ inputs.resume_tag }}" -p "checkpoint.tar.gz" -D "$WORK/resume"
          tar -xzf "$WORK/resume/checkpoint.tar.gz" -C "$WORK/resume"
          echo "RESUME_CHECKPOINT=$WORK/resume/checkpoint/latest" >> "$GITHUB_ENV"
          # the checkpoint must be continued with the dictionary of the same product
          ckpt="$WORK/resume/checkpoint"
          if [ -f "$ckpt/model.env" ]; then
            grep -q "NAME=${{ inputs.product }}_PP-OCRv5" "$ckpt/model.env" && ok=1 || ok=0
          else  # early releases: Vietnamese + English checkpoints only
            [ "${{ inputs.product }}" = "vi_en" ] && [ -f "$ckpt/vi_en_dict.txt" ] && ok=1 || ok=0
          fi
          [ "$ok" = 1 ] || { echo "::error::checkpoint of ${{ inputs.resume_tag }} is not a ${{ inputs.product }} model"; exit 1; }

      - name: Train and export
        env:
          LANGS: ${{ inputs.product == 'vi_en_ja' && 'vi,en,ja' || 'vi,en' }}
          SAMPLES: ${{ inputs.samples }}
          EPOCHS: ${{ inputs.epochs }}
          TIME_BUDGET_MIN: ${{ inputs.time_budget_minutes }}
        run: training/vi_ocr/run_training.sh

      - name: Evaluate against the product baseline
        continue-on-error: true  # never lose a finished training run to an evaluation problem
        working-directory: training/vi_ocr
        env:
          LANGS: ${{ inputs.product == 'vi_en_ja' && 'vi,en,ja' || 'vi,en' }}
        run: |
          source "$WORK/model.env"
          sets=()
          for lang in ${LANGS//,/ }; do sets+=("$WORK/data/eval_$lang"); done
          python evaluate.py --eval "${sets[@]}" "$WORK/data/eval_clean" \
            --baseline "$BASE_MODEL" --model "$NAME (fine-tuned)=$WORK/export" --model-name "$BASE_MODEL" \
            --report "$WORK/report.md"
          cat "$WORK/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Package
        if: ${{ !cancelled() }}
        run: |
          source "$WORK/model.env"
          mkdir -p "$WORK/dist/$NAME" "$WORK/dist/checkpoint"
          # checkpoint first: it allows resuming even if the export below is missing
          cp "$WORK"/output/latest.* "$WORK/dict.txt" "$WORK/model.env" "$WORK/dist/checkpoint/"
          tar -czf "$WORK/dist/checkpoint.tar.gz" -C "$WORK/dist" checkpoint
          cp -r "$WORK/export/." "$WORK/dist/$NAME/"
          tar -czf "$WORK/dist/$NAME.tar.gz" -C "$WORK/dist" "$NAME"
          ls -la "$WORK/dist"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: ${{ inputs.product }}-ocr-model-${{ github.run_number }}
          path: |
            ${{ env.WORK }}/dist/*.tar.gz
            ${{ env.WORK }}/report.*
            ${{ env.WORK }}/output/train.log

      - name: Publish release
        if: ${{ !cancelled() && inputs.publish && hashFiles('vi_ocr_work/dist/*_PP-OCRv5_mobile_rec.tar.gz') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source "$WORK/model.env"
          {
            echo "Product ${{ inputs.product }}: fine-tuned PP-OCRv5 mobile recognition model $NAME (baseline: $BASE_MODEL)."
            echo "Trained by run ${{ github.run_id }}: samples=${{ inputs.samples }}, epochs=${{ inputs.epochs }}, resume='${{ inputs.resume_tag }}'."
            echo
            cat "$WORK/report.md" 2>/dev/null || echo "(evaluation report missing: see the workflow logs)"
          } > "$WORK/notes.md"
          assets=("$WORK/dist/$NAME.tar.gz" "$WORK/dist/checkpoint.tar.gz")
          for f in "$WORK/report.md" "$WORK/report.json"; do [ -f "$f" ] && assets+=("$f"); done
          gh release create "${{ inputs.product }}-ocr-${{ github.run_number }}" "${assets[@]}" \
            --target "${{ github.sha }}" --title "${{ inputs.product }} OCR model #${{ github.run_number }}" --notes-file "$WORK/notes.md"
