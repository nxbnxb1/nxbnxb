name: "Việt + Anh · Benchmark"

# Product vi_en: its baseline (stock PaddleOCR model) and its fine-tuned model on documents with
# ground truth, per category (see _benchmark.yml).

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: "eval (held-out set), demo, or a folder with documents + <name>.gt.md"
        default: eval
      split:
        description: "test (report), dev (tuning) or all"
        type: choice
        options: [test, dev, all]
        default: test
      vlm:
        description: "VLM: none, local (free but ~2 min per picture on the runner), api (secrets)"
        type: choice
        options: [none, local, api]
        default: none
      model_tag:
        description: Release of the fine-tuned model (empty = newest vi_en model)
        default: ""

permissions:
  contents: read

jobs:
  bench:
    uses: ./.github/workflows/_benchmark.yml
    with:
      product: vi_en
      dataset: ${{ inputs.dataset }}
      split: ${{ inputs.split }}
      model_tag: ${{ inputs.model_tag }}
      vlm: ${{ inputs.vlm }}
    secrets: inherit
