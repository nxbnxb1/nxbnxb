name: _zz_dbg_c (reusable)

# Fine-tunes the PP-OCRv5 recogniser of one product on synthetic text lines so it reads
# Vietnamese (stock PaddleOCR dictionaries lack most Vietnamese letters with stacked diacritics)
# while keeping English and, for vi_en_ja, Japanese.
#
# A GitHub runner has 4 CPU cores and no GPU, so training runs on several runners at once in
# rounds (local SGD): in each round every runner starts from the same weights, trains on its own
# fresh synthetic lines, and the weights of all runners are averaged (jobs shard-rK / average-rK,
# written by scripts/gen_train_rounds.py). After the last round the average is exported,
# evaluated against the product's own baseline (the stock model it starts from) and published as
# the Release "<product>-ocr-<run>", which the product's Extract/Benchmark workflows download.

on:
  workflow_call:
    inputs:
      product:
        type: string
        required: true
      runners:
        type: number
        default: 8
      rounds:
        type: number  # 1 to 6
        default: 4
      round_minutes:
        type: number  # at most 100
        default: 50
      lines:
        type: number  # new synthetic lines per runner and round (~9 lines/s are trained)
        default: 24000
      resume_tag:
        type: string
        default: ""
      publish:
        type: boolean
        default: true

permissions:
  contents: write

env:
  PADDLEOCR_REF: dab3fe35379033fdcb2d0e9572fac0b36c9a9ebf  # training code, pinned
  WORK: ${{ github.workspace }}/vi_ocr_work
  PADDLEOCR_DIR: ${{ github.workspace }}/PaddleOCR
  LANGS: ${{ inputs.product == 'vi_en_ja' && 'vi,en,ja' || 'vi,en' }}
  # CPU settings measured by "OCR training · speed probe" (samples/s on a 4-core runner, batch 32):
  #   vi_en 1.0 as PaddleOCR trains → 2.4 fused backbone → 8.8 fused + CTC branch only
  #   vi_en_ja 0.8 → 1.6 → 7.1; freezing stages 1-4 adds little, so the whole backbone trains
  NEW_MODEL_FUSE: "1"  # continued weights keep their own setting
  FREEZE: ""
  GTC: "0"

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/ocr-train-setup
        with:
          paddleocr-ref: ${{ env.PADDLEOCR_REF }}
          paddleocr-dir: ${{ env.PADDLEOCR_DIR }}

      - name: Weights to continue from
        if: inputs.resume_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$WORK/resume_dl"
          gh release download "${{ inputs.resume_tag }}" -p "checkpoint.tar.gz" -D "$WORK/resume_dl"
          tar -xzf "$WORK/resume_dl/checkpoint.tar.gz" -C "$WORK/resume_dl"
          ckpt="$WORK/resume_dl/checkpoint"
          grep -q "NAME=${{ inputs.product }}_PP-OCRv5" "$ckpt/model.env" \
            || { echo "::error::${{ inputs.resume_tag }} is not a ${{ inputs.product }} model"; exit 1; }
          mkdir -p "$WORK/resume"
          weights=$(ls "$ckpt"/weights.pdparams "$ckpt"/latest.pdparams 2>/dev/null | head -1)
          cp "$weights" "$WORK/resume/weights.pdparams"
          # continued weights keep the dictionary and the structure (fused or not) they were trained with
          echo "RESUME_DICT=$ckpt/dict.txt" >> "$GITHUB_ENV"
          echo "RESUME_FUSE=$(sed -n 's/^FUSE=//p' "$ckpt/model.env" | head -1 | grep . || echo 0)" >> "$GITHUB_ENV"

      - name: Dictionary, initial weights, validation and evaluation lines
        env:
          FUSE: ${{ env.RESUME_FUSE || env.NEW_MODEL_FUSE }}
        run: |
          training/vi_ocr/run_training.sh prepare
          cat "$WORK/model.env"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.product }}-prep
          path: |
            ${{ env.WORK }}/model.env
            ${{ env.WORK }}/dict.txt
            ${{ env.WORK }}/pretrained/init.pdparams
            ${{ env.WORK }}/resume/
            ${{ env.WORK }}/data/
          retention-days: 7

      - id: plan
        run: echo "shards=$(python -c 'import json; print(json.dumps(list(range(1, ${{ inputs.runners }} + 1))))')" >> "$GITHUB_OUTPUT"

  # --- rounds: generated by scripts/gen_train_rounds.py, do not edit by hand ---
  shard-r1:
    needs: [prepare]
    if: ${{ !cancelled() && inputs.rounds >= 1 && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    continue-on-error: true  # a lost runner only removes its share from the average
    timeout-minutes: 150  # round_minutes (at most 100) + setup, data and upload
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/ocr-train-setup
        with:
          paddleocr-ref: ${{ env.PADDLEOCR_REF }}
          paddleocr-dir: ${{ env.PADDLEOCR_DIR }}

      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.product }}-prep
          path: ${{ env.WORK }}

      - name: Train (round 1, runner ${{ matrix.shard }})
        run: |
          source "$WORK/model.env"  # FUSE, FREEZE, GTC, LR of this training
          if [ -s "$WORK/start/avg.pdparams" ]; then export INIT_PARAMS="$WORK/start/avg.pdparams"
          elif [ -s "$WORK/resume/weights.pdparams" ]; then export INIT_PARAMS="$WORK/resume/weights.pdparams"; fi
          # constant LR per round, cosine over the rounds; warm-up at the start of every round
          # because each runner starts with a fresh optimizer
          export LR=$(python -c "import math; r, n, lr = 1, ${{ inputs.rounds }}, $LR; print(f'{lr * 0.5 * (1 + math.cos(math.pi * (r - 0.5) / n)):.6g}')")
          export LR_CONST=1 NO_EVAL=1 WARMUP=0.1 FUSE FREEZE GTC
          SAMPLES=${{ inputs.lines }} CHUNK=${{ inputs.lines }} EPOCHS=100 BATCH=32 PRINT_STEP=10 \
          SEED=$(( 1 * 1000 + ${{ matrix.shard }} )) TIME_BUDGET_MIN=${{ inputs.round_minutes }} \
            training/vi_ocr/run_training.sh train
          grep -E "avg_batch_cost" "$WORK/output/train.log" | tail -1 || true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.product }}-r1-shard-${{ matrix.shard }}
          path: ${{ env.WORK }}/output/final.pdparams
          retention-days: 7

  average-r1:
    needs: [prepare, shard-r1]
    if: ${{ !cancelled() && inputs.rounds >= 1 && needs.shard-r1.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/ocr-train-setup
        with:
          paddleocr-ref: ${{ env.PADDLEOCR_REF }}
          paddleocr-dir: ${{ env.PADDLEOCR_DIR }}

      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.product }}-prep
          path: ${{ env.WORK }}

      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.product }}-r1-shard-*
          path: shards

      - name: Average the runners' weights
        run: |
          mkdir -p avg
          found=$(ls shards/*/final.pdparams 2>/dev/null | wc -l)
          wanted=${{ inputs.runners }}
          echo "$found of $wanted runners finished round 1"
          [ $((found * 2)) -ge "$wanted" ] || { echo "::error::fewer than half of the runners finished"; exit 1; }
          python training/vi_ocr/average_params.py avg/avg.pdparams shards/*/final.pdparams

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.product }}-avg-r1
          path: avg/avg.pdparams
          retention-days: 7

      - name: Validation after round 1
        continue-on-error: true
        run: |
          source "$WORK/model.env"
          export FUSE
          EXPORT_PARAMS="$GITHUB_WORKSPACE/avg/avg.pdparams" training/vi_ocr/run_training.sh export
          sets=()
          for lang in ${LANGS//,/ }; do sets+=("$WORK/data/val_$lang"); done
          (cd training/vi_ocr && python evaluate.py --eval "${sets[@]}" --model "round 1=$WORK/export" \
            --model-name "$BASE_MODEL" --report "$WORK/val.md")
          { echo "### ${{ inputs.product }}: after round 1 of ${{ inputs.rounds }} (validation lines)"; cat "$WORK/val.md"; } >> "$GITHUB_STEP_SUMMARY"

