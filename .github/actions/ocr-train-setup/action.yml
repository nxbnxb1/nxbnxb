name: OCR training setup
description: Python, fonts for synthetic text (Vietnamese, Japanese), PaddleOCR training code and packages.

inputs:
  paddleocr-ref:
    description: PaddleOCR commit with the training code
    required: true
  paddleocr-dir:
    description: where to check it out
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip

    # fonts are cached: installing them with apt sometimes takes 15 minutes, and every round of
    # training waits for its slowest runner
    - name: Cached fonts
      id: fonts
      uses: actions/cache@v4
      with:
        path: ~/.fonts
        key: ocr-train-fonts-v2-${{ runner.os }}

    - name: Fonts with Vietnamese and Japanese coverage
      if: steps.fonts.outputs.cache-hit != 'true'
      shell: bash
      run: |
        packages="fonts-dejavu-core fonts-liberation2 fonts-freefont-ttf fonts-noto-core fonts-crosextra-carlito
          fonts-crosextra-caladea fonts-roboto fonts-open-sans fonts-noto-cjk fonts-ipaexfont-gothic fonts-ipaexfont-mincho"
        sudo apt-get update -qq
        sudo apt-get install -y -qq $packages >/dev/null
        mkdir -p ~/.fonts
        # every installed font file (some packages only depend on others that hold the files)
        find -L /usr/share/fonts -type f \( -name '*.ttf' -o -name '*.otf' -o -name '*.ttc' \) -exec cp -L -t ~/.fonts {} +
        ls ~/.fonts | wc -l

    - name: PaddleOCR training code
      shell: bash
      run: |
        git init -q "${{ inputs.paddleocr-dir }}"
        git -C "${{ inputs.paddleocr-dir }}" fetch -q --depth 1 https://github.com/PaddlePaddle/PaddleOCR "${{ inputs.paddleocr-ref }}"
        git -C "${{ inputs.paddleocr-dir }}" checkout -q FETCH_HEAD

    - name: Python packages
      shell: bash
      run: |
        pip install "paddlepaddle==3.3.1" "paddleocr==3.7.0" wordfreq fonttools rapidfuzz
        pip install -r "${{ inputs.paddleocr-dir }}/requirements.txt"
        pip install -e .  # docextract: text checks and PDF tools used to cut lines from real documents
        # albumentations pulls opencv-python-headless, which shadows the cv2 build PaddleX expects
        pip uninstall -y opencv-python-headless opencv-python || true
        pip install --force-reinstall --no-deps "opencv-contrib-python==4.10.0.84"
        nproc; free -g; lscpu | grep -E 'Model name|Flags' | cut -c1-300
